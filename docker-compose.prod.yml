version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: adwais-web-prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - VITE_AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
    restart: always
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/server/ADWAIS/src/Api/Dockerfile
    container_name: adwais-api-prod
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__AnalyticsDb=Host=db;Database=analyticsdb;Username=postgres;Password=${DB_PASSWORD}
      - Webhooks__MotasticApiKey=${MOTASTIC_API_KEY}
      - AzureAd__TenantId=${AZURE_TENANT_ID}
      - AzureAd__ClientId=${AZURE_CLIENT_ID}
      - Authentication__KioskJwtSecret=${KIOSK_JWT_SECRET}
      - MasterEncryptionKey=${MASTER_ENCRYPTION_KEY}
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16-alpine
    container_name: adwais-db-prod
    environment:
      - POSTGRES_DB=analyticsdb
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata-prod:
