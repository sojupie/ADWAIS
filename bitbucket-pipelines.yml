image: atlassian/default-image:4

pipelines:
  branches:
    main:
      - step:
          name: Build and Push Image
          services:
            - docker
          script:
            # Build API Image
            - export API_IMAGE=$DOCKER_HUB_USER/adwais-api:latest
            - docker build -t $API_IMAGE -f apps/server/ADWAIS/src/Api/Dockerfile .
            - echo "$DOCKER_HUB_PASSWORD" | docker login -u $DOCKER_HUB_USER --password-stdin
            - docker push $API_IMAGE
      - step:
          name: Build Frontend Web App
          image: node:24.15.0
          script:
            - corepack enable
            - corepack prepare pnpm@11.5.0 --activate
            - export VITE_AZURE_CLIENT_ID=$AZURE_CLIENT_ID
            - export VITE_AZURE_TENANT_ID=$AZURE_TENANT_ID
            - pnpm install
            - pnpm --filter web build
          artifacts:
            - apps/web/dist/**
      - step:
          name: Deploy to Hetzner
          script:
            # Transfer Compose file
            - pipe: atlassian/scp-deploy:1.6.0
              variables:
                USER: "motillo"
                SERVER: $SERVER_IP
                REMOTE_PATH: "/opt/adwais"
                LOCAL_PATH: "docker-compose.prod.yml"

            # Transfer Nginx config template
            - pipe: atlassian/scp-deploy:1.6.0
              variables:
                USER: "motillo"
                SERVER: $SERVER_IP
                REMOTE_PATH: "/opt/adwais"
                LOCAL_PATH: "infrastructure/nginx/kpi.motillo.com.conf"

            # Transfer React build artifacts
            - pipe: atlassian/scp-deploy:1.6.0
              variables:
                USER: "motillo"
                SERVER: $SERVER_IP
                REMOTE_PATH: "/var/www/kpi.motillo.com"
                LOCAL_PATH: "apps/web/dist/*"

            # Execute Service Orchestration
            - pipe: atlassian/ssh-run:0.6.0
              variables:
                SSH_USER: "motillo"
                SERVER: $SERVER_IP
                COMMAND: |
                  set -e
                  cd /opt/adwais
                  echo -e "DASHBOARD_USER=${DASHBOARD_USER}\nDASHBOARD_PASS=${DASHBOARD_PASS}\nDOCKER_HUB_USER=${DOCKER_HUB_USER}\nDB_PASSWORD=${DB_PASSWORD}\nAZURE_TENANT_ID=${AZURE_TENANT_ID}\nAZURE_CLIENT_ID=${AZURE_CLIENT_ID}\nMOTASTIC_API_KEY=${MOTASTIC_API_KEY}\nKIOSK_JWT_SECRET=${KIOSK_JWT_SECRET}" > .env
                  sudo docker compose -f docker-compose.prod.yml pull
                  sudo docker compose -f docker-compose.prod.yml up -d
                  sudo cp /opt/adwais/kpi.motillo.com.conf /etc/nginx/sites-available/
                  sudo ln -sf /etc/nginx/sites-available/kpi.motillo.com.conf /etc/nginx/sites-enabled/
                  sudo systemctl reload nginx
