version: '3.8'

services:
  api:
    image: ${DOCKER_HUB_USER}/adwais-api:latest
    container_name: adwais-api-prod
    ports:
      - "127.0.0.1:5002:8080"
    environment:
      - DashboardAuth__Username=${DASHBOARD_USER}
      - DashboardAuth__Password=${DASHBOARD_PASS}
      - ConnectionStrings__AnalyticsDb=Host=db;Database=analyticsdb;Username=postgres;Password=${DB_PASSWORD}
      - Webhooks__MotasticApiKey=${MOTASTIC_API_KEY}
      - AzureAd__TenantId=${AZURE_TENANT_ID}
      - AzureAd__ClientId=${AZURE_CLIENT_ID}
      - AzureAd__AppIdUri=api://${AZURE_CLIENT_ID}
      - Authentication__KioskJwtSecret=${KIOSK_JWT_SECRET}
      - ASPNETCORE_ENVIRONMENT=Production
      - FeatureToggles__EnableRuntimeDataSeeding=true
      - FeatureToggles__MockUptimeRobotIntegrations=true
    volumes:
      - dp-keys-prod:/app/dp-keys
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16-alpine
    container_name: adwais-db-prod
    environment:
      - POSTGRES_DB=analyticsdb
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata-prod:
  dp-keys-prod:
